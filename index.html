<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>유튜브 멀티뷰 프로</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1e1e1e;
      --accent: #ff0000;
      --text: #ffffff;
    }
    body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: sans-serif; overflow-x: hidden;
    }
    #setupSection { padding: 20px; text-align: center; }
    .controls { margin-bottom: 20px; }
    input, button { padding: 10px; border-radius: 5px; border: none; margin: 5px; }
    #urlInputs { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 10px; max-width: 1000px; margin: 0 auto; 
    }
    #urlInputs input { background: #333; color: #fff; }

    /* 멀티뷰 모드 */
    #viewerSection { display: none; height: 100vh; flex-direction: column; }
    #masterBar { 
      background: rgba(0,0,0,0.8); padding: 10px; 
      display: flex; justify-content: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
    }
    #iframeContainer {
      flex-grow: 1; display: grid; gap: 5px; padding: 5px;
      background: #000;
    }
    .video-tile {
      position: relative; background: #222; cursor: move;
      width: 100%; height: 100%; min-height: 200px;
    }
    .video-tile iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }
    /* 드래그 중인 타일 스타일 */
    .sortable-ghost { opacity: 0.4; border: 2px dashed var(--accent); }

    .btn { cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-red { background: var(--accent); color: white; }
    .btn-gray { background: #444; color: white; }
    .btn:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <div id="setupSection">
    <h1>🎬 YouTube MultiView Pro</h1>
    <div class="controls">
      <input type="number" id="countInput" min="1" max="16" value="4">
      <button class="btn btn-gray" onclick="createInputs()">입력창 만들기</button>
    </div>
    <div id="urlInputs"></div>
    <button id="startBtn" class="btn btn-red" style="display:none; width: 200px; margin-top:20px;">멀티뷰 시작</button>
  </div>

  <div id="viewerSection">
    <div id="masterBar">
      <button class="btn btn-red" onclick="allPlay()">▶ 동시 재생</button>
      <button class="btn btn-gray" onclick="allPause()">⏸ 동시 일시정지</button>
      <button class="btn btn-gray" onclick="allMute(true)">🔇 전체 뮤트</button>
      <button class="btn btn-gray" onclick="allMute(false)">🔊 뮤트 해제</button>
      <button class="btn btn-gray" onclick="exitViewer()">❌ 나가기</button>
    </div>
    <div id="iframeContainer"></div>
  </div>

  <script>
    let players = [];

    // 1. 입력창 생성
    function createInputs() {
      const count = document.getElementById('countInput').value;
      const container = document.getElementById('urlInputs');
      container.innerHTML = '';
      for(let i=0; i<count; i++) {
        container.innerHTML += `<input type="text" class="url-in" placeholder="유튜브 URL #${i+1}">`;
      }
      document.getElementById('startBtn').style.display = 'inline-block';
    }

    // 2. 유튜브 ID 추출
    function getYTId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 3. 멀티뷰 시작
    document.getElementById('startBtn').onclick = function() {
      const inputs = document.querySelectorAll('.url-in');
      const urls = Array.from(inputs).map(i => i.value).filter(v => getYTId(v));
      
      if(urls.length === 0) return alert("올바른 유튜브 주소를 입력해주세요.");

      document.getElementById('setupSection').style.display = 'none';
      document.getElementById('viewerSection').style.display = 'flex';

      const container = document.getElementById('iframeContainer');
      container.innerHTML = '';
      players = [];

      // 그리드 계산
      const cols = Math.ceil(Math.sqrt(urls.length));
      container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      urls.forEach((url, index) => {
        const videoId = getYTId(url);
        const tile = document.createElement('div');
        tile.className = 'video-tile';
        tile.id = `player-container-${index}`;
        
        const playerDiv = document.createElement('div');
        playerDiv.id = `player-${index}`;
        tile.appendChild(playerDiv);
        container.appendChild(tile);

        // API 플레이어 생성
        const player = new YT.Player(`player-${index}`, {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: { 'autoplay': 1, 'mute': 1, 'rel': 0 },
          events: {
            'onReady': (event) => { players.push(event.target); }
          }
        });
      });

      // 드래그 앤 드롭 활성화
      new Sortable(container, {
        animation: 150,
        ghostClass: 'sortable-ghost'
      });
    };

    // 4. 마스터 컨트롤 함수들
    function allPlay() { players.forEach(p => p.playVideo()); }
    function allPause() { players.forEach(p => p.pauseVideo()); }
    function allMute(isMute) {
      players.forEach(p => isMute ? p.mute() : p.unMute());
    }

    function exitViewer() {
      if(!confirm("멀티뷰를 종료할까요?")) return;
      location.reload(); // 간단하게 초기화
    }
  </script>
</body>
</html>
