<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>유튜브 멀티뷰어</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #ff0000;
    }
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
    }
    h1 { text-align: center; margin: 20px 0; font-size: 1.5rem; }
    
    .controls {
      max-width: 800px; margin: 0 auto 20px;
      padding: 20px; background: var(--card-bg);
      border-radius: 12px; display: flex; flex-wrap: wrap;
      gap: 15px; justify-content: center; align-items: center;
    }
    input, select, button {
      padding: 10px; border-radius: 6px; border: none; font-size: 1rem;
    }
    #urlInputs {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; max-width: 800px; margin: 0 auto;
    }
    #urlInputs input { background: #333; color: white; width: 100%; box-sizing: border-box; }
    
    #openBtn {
      display: block; width: 200px; margin: 20px auto;
      background: var(--accent-color); color: white; font-weight: bold; cursor: pointer;
    }

    /* 멀티뷰 컨테이너 */
    #iframeContainer {
      display: grid;
      width: 100vw; height: 100vh;
      background: #000;
      display: none; /* 초기엔 숨김 */
    }
    .iframe-wrapper {
      position: relative; width: 100%; height: 100%;
      background: #000;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }

    #closeBtn {
      position: fixed; top: 10px; right: 10px;
      width: 40px; height: 40px; background: rgba(255,0,0,0.8);
      color: white; border-radius: 50%; display: none;
      align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="setupSection">
    <h1>🎬 유튜브 멀티뷰 생성기</h1>
    <div class="controls">
      <label>분할 수:</label>
      <input type="number" id="countInput" min="1" max="16" value="4" />
      <button id="generateBtn" style="background: #444; color:white;">입력창 생성</button>
    </div>
    <div id="urlInputs"></div>
    <button id="openBtn" style="display:none;">멀티뷰 시작</button>
  </div>

  <div id="closeBtn">X</div>
  <div id="iframeContainer"></div>

  <script>
    const countInput = document.getElementById("countInput");
    const generateBtn = document.getElementById("generateBtn");
    const urlInputsForm = document.getElementById("urlInputs");
    const openBtn = document.getElementById("openBtn");
    const iframeContainer = document.getElementById("iframeContainer");
    const setupSection = document.getElementById("setupSection");
    const closeBtn = document.getElementById("closeBtn");

    // 유튜브 URL 변환 함수
    function formatYoutubeUrl(url) {
      if (!url.trim()) return "";
      let videoId = "";
      
      try {
        if (url.includes("youtu.be/")) {
          videoId = url.split("youtu.be/")[1].split(/[?#]/)[0];
        } else if (url.includes("youtube.com/shorts/")) {
          videoId = url.split("shorts/")[1].split(/[?#]/)[0];
        } else if (url.includes("v=")) {
          videoId = url.split("v=")[1].split(/[&?#]/)[0];
        } else if (url.includes("embed/")) {
          return url; // 이미 embed 주소인 경우
        }

        if (videoId) {
          // autoplay=1(자동재생), mute=1(소리끔), rel=0(관련영상방지)
          return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&rel=0`;
        }
      } catch (e) {
        return url;
      }
      return url;
    }

    generateBtn.addEventListener("click", () => {
      let count = parseInt(countInput.value);
      urlInputsForm.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = `유튜브 주소를 입력하세요 #${i + 1}`;
        input.className = "url-input";
        urlInputsForm.appendChild(input);
      }
      openBtn.style.display = "block";
    });

    openBtn.addEventListener("click", () => {
      const inputs = document.querySelectorAll(".url-input");
      const urls = Array.from(inputs).map(input => input.value).filter(v => v !== "");
      
      if (urls.length === 0) return alert("URL을 입력해주세요.");

      setupSection.style.display = "none";
      iframeContainer.style.display = "grid";
      closeBtn.style.display = "flex";

      // 그리드 계산
      const count = urls.length;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);

      iframeContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      iframeContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      iframeContainer.innerHTML = "";
      urls.forEach(url => {
        const wrapper = document.createElement("div");
        wrapper.className = "iframe-wrapper";
        const iframe = document.createElement("iframe");
        iframe.src = formatYoutubeUrl(url);
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        wrapper.appendChild(iframe);
        iframeContainer.appendChild(wrapper);
      });
    });

    closeBtn.addEventListener("click", () => {
      setupSection.style.display = "block";
      iframeContainer.style.display = "none";
      closeBtn.style.display = "none";
      iframeContainer.innerHTML = "";
    });
  </script>
</body>
</html>
